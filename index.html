<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#16221F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Штамп показаний</title>
<style>
  :root{
    --bg: #EAF0EE;
    --surface: #FFFFFF;
    --ink: #16221F;
    --ink-soft: #57655F;
    --line: #D9E2DF;
    --day: #C98A2E;
    --night: #34486B;
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap{ max-width: 480px; margin:0 auto; padding: 20px 16px 50px; }
  header{ margin-bottom: 16px; }
  header h1{ font-size: 20px; margin:0 0 4px; }
  header p{ margin:0; font-size: 13.5px; color: var(--ink-soft); line-height:1.4; }

  .house-card{
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 14px;
  }
  .house-card label{ display:block; font-size:12px; color: var(--ink-soft); margin-bottom:5px; }
  .house-card input{
    width:100%; padding: 10px 11px; border-radius:9px; border:1px solid var(--line);
    font-size:14.5px; background:#FBFCFB; color:var(--ink);
  }
  .house-card .hint{ font-size:11.5px; color: var(--ink-soft); margin-top:6px; }

  .stage{
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
    padding: 12px; margin-bottom: 14px;
  }
  .drop{
    border: 1px dashed #B9C6C2; border-radius: 10px; background:#F7FAF9;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 34px 10px; cursor:pointer; text-align:center;
  }
  .drop .icon{ font-size: 30px; margin-bottom: 8px; }
  .drop b{ font-size: 14.5px; display:block; margin-bottom: 3px; }
  .drop span{ font-size: 12.5px; color: var(--ink-soft); }
  input[type=file]{ display:none; }

  .cam-wrap{ display:none; position:relative; border-radius:10px; overflow:hidden; background:#000; aspect-ratio: 1 / 1; }
  .cam-wrap video{ width:100%; height:100%; object-fit:cover; display:block; }
  .cam-controls{
    position:absolute; bottom:10px; left:0; right:0;
    display:flex; align-items:center; justify-content:center; gap:14px;
  }
  .torch-btn{
    width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,0.5);
    background: rgba(0,0,0,0.35); color:#fff; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .torch-btn.on{ background: var(--day); border-color: var(--day); }
  .shutter-btn{
    width:64px; height:64px; border-radius:50%; border:4px solid #fff;
    background: rgba(255,255,255,0.25); cursor:pointer;
  }
  .cam-note{
    position:absolute; top:8px; left:8px; right:8px; text-align:center;
    font-size:11px; color:#fff; background:rgba(0,0,0,0.4); border-radius:6px; padding:4px 6px;
    display:none;
  }

  canvas{
    width:100%; height:100%; border-radius: 10px; display:none; background:#000;
    position:absolute; top:0; left:0; object-fit:cover;
  }

  .retake{
    display:none; margin-top: 10px; width:100%; padding: 9px; border-radius: 9px;
    border: 1px solid var(--line); background: #FBFCFB; color: var(--ink-soft);
    font-size: 13px;
  }

  .card{
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
    padding: 14px; margin-bottom: 14px;
  }
  .row{ display:flex; gap:10px; margin-bottom: 12px; }
  .field{ flex:1; }
  .field label{ display:block; font-size:12px; color: var(--ink-soft); margin-bottom:5px; }
  .field input{
    width:100%; padding: 10px 11px; border-radius:9px; border:1px solid var(--line);
    font-size:16px; font-family: "SFMono-Regular", Consolas, Menlo, monospace; background:#FBFCFB; color:var(--ink);
  }
  .field.day input{ border-color:#E6C88C; }
  .field.night input{ border-color:#AEB9D6; }

  .date-toggle{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 14px; gap: 10px; flex-wrap: wrap;
  }
  .switch{ display:flex; align-items:center; gap:9px; font-size: 13.5px; color: var(--ink); cursor:pointer; }
  .switch input{ width: 34px; height: 20px; appearance:none; -webkit-appearance:none;
    background:#D9E2DF; border-radius: 20px; position:relative; cursor:pointer; outline:none; flex-shrink:0;
  }
  .switch input::before{
    content:''; position:absolute; top:2px; left:2px; width:16px; height:16px;
    background:#fff; border-radius:50%; transition: transform 0.15s;
  }
  .switch input:checked{ background: var(--ink); }
  .switch input:checked::before{ transform: translateX(14px); }
  .date-input{
    padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line);
    font-size: 13px; color: var(--ink); background:#FBFCFB;
  }
  .date-input:disabled{ opacity: 0.4; }

  .type-picker{ display:flex; gap:8px; margin-bottom: 14px; }
  .type-btn{
    flex:1; padding: 10px 4px; border-radius: 9px; border: 1px solid var(--line);
    background:#FBFCFB; font-size: 13px; color: var(--ink-soft); cursor:pointer;
  }
  .type-btn.active{ background: var(--ink); color:#fff; border-color: var(--ink); }

  .corner-picker{ display:flex; gap:8px; margin-bottom: 14px; }
  .corner-btn{
    flex:1; padding: 8px 4px; border-radius: 8px; border: 1px solid var(--line);
    background:#FBFCFB; font-size: 11.5px; color: var(--ink-soft); cursor:pointer;
  }
  .corner-btn.active{ background: var(--ink); color:#fff; border-color: var(--ink); }

  button.primary{
    width:100%; padding: 13px; border:none; border-radius: 10px;
    background: var(--ink); color:#F3F6F5; font-size:15px; font-weight:600; cursor:pointer;
  }
  button.primary:disabled{ opacity:0.4; }
  button.primary:active{ transform: scale(0.99); }

  .toast{
    position: fixed; bottom: 18px; left:50%; transform: translateX(-50%);
    background: var(--ink); color:#fff; padding: 9px 16px; border-radius: 20px;
    font-size:13px; opacity:0; transition: opacity 0.25s; pointer-events:none;
  }
  .toast.show{ opacity:1; }

  .credit{
    text-align:center; font-size: 12px; color: var(--ink-soft); margin-top: 22px;
  }
  .credit a{ color: var(--ink-soft); text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Штамп показаний</h1>
    <p>Фото счётчика + день/ночь впечатываются прямо на снимок. Сохраняется одним изображением.</p>
  </header>

  <div class="house-card">
    <label>Посёлок / населённый пункт (заполнить один раз)</label>
    <input type="text" id="villageInput" placeholder="напр. п. Боровский">
    <div class="hint" style="margin-bottom:12px;">Тоже запоминается на телефоне</div>

    <label>Улица и дом (заполнить один раз)</label>
    <input type="text" id="houseInput" placeholder="напр. ул. Ленина, д. 5">
    <div class="hint">Запоминается на этом телефоне, не нужно вводить каждый раз</div>
  </div>

  <div class="stage">
    <label class="drop" id="drop">
      <div class="icon">📷</div>
      <b id="dropTitle">Открыть камеру</b>
      <span>Фонарик можно включить прямо в камере</span>
    </label>

    <div class="cam-wrap" id="camWrap">
      <div class="cam-note" id="camNote"></div>
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div class="cam-controls" id="camControls">
        <button class="torch-btn" id="torchBtn" title="Фонарик">🔦</button>
        <button class="shutter-btn" id="shutterBtn" title="Сделать фото"></button>
      </div>
    </div>

    <button class="retake" id="retakeBtn">Переснять фото</button>
    <button class="retake" id="closeCamBtn" style="display:none;">Выключить камеру и фонарик</button>
  </div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label>Квартира</label>
        <input type="text" inputmode="numeric" id="flatInput" placeholder="№">
      </div>
    </div>
    <div class="date-toggle">
      <label class="switch">
        <input type="checkbox" id="dateToggle" checked>
        <span>Ставить дату на фото</span>
      </label>
      <input type="date" id="dateInput" class="date-input">
    </div>

    <div class="type-picker">
      <button class="type-btn active" data-type="split">День / Ночь</button>
      <button class="type-btn" data-type="single">Общий счётчик</button>
    </div>

    <div class="row" id="splitRow">
      <div class="field day">
        <label>День (Т1)</label>
        <input type="text" inputmode="decimal" id="dayInput" placeholder="0000">
      </div>
      <div class="field night">
        <label>Ночь (Т2)</label>
        <input type="text" inputmode="decimal" id="nightInput" placeholder="0000">
      </div>
    </div>

    <div class="row" id="singleRow" style="display:none;">
      <div class="field">
        <label>Показание</label>
        <input type="text" inputmode="decimal" id="singleInput" placeholder="0000">
      </div>
    </div>

    <label style="display:block; font-size:12px; color:var(--ink-soft); margin-bottom:7px;">Угол на фото</label>
    <div class="corner-picker">
      <button class="corner-btn" data-corner="tl">↖ верх-лево</button>
      <button class="corner-btn" data-corner="tr">↗ верх-право</button>
      <button class="corner-btn active" data-corner="bl">↙ низ-лево</button>
      <button class="corner-btn" data-corner="br">↘ низ-право</button>
    </div>

    <button class="primary" id="saveBtn" disabled>Сначала сделайте фото</button>
  </div>

  <footer class="credit">
    Разработано <a href="https://github.com/alexanderkrivonogov" target="_blank" rel="noopener">@alexanderkrivonogov</a>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const drop = $('drop');
const dropTitle = $('dropTitle');
const camWrap = $('camWrap');
const camControls = $('camControls');
const camNote = $('camNote');
const video = $('video');
const torchBtn = $('torchBtn');
const shutterBtn = $('shutterBtn');
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
const retakeBtn = $('retakeBtn');
const closeCamBtn = $('closeCamBtn');
const houseInput = $('houseInput');
const villageInput = $('villageInput');
const flatInput = $('flatInput');
const dateToggle = $('dateToggle');
const dateInput = $('dateInput');
const dayInput = $('dayInput');
const nightInput = $('nightInput');
const singleInput = $('singleInput');
const splitRow = $('splitRow');
const singleRow = $('singleRow');
const saveBtn = $('saveBtn');
const toastEl = $('toast');

let baseImg = null;
let corner = 'bl';
let meterType = 'split';
let stream = null;
let track = null;
let torchOn = false;
let desiredTorch = false;

// --- house/village field persistence ---
try{
  const savedHouse = localStorage.getItem('meter-house');
  if(savedHouse) houseInput.value = savedHouse;
  const savedVillage = localStorage.getItem('meter-village');
  if(savedVillage) villageInput.value = savedVillage;
}catch(err){}
houseInput.addEventListener('input', ()=>{
  try{ localStorage.setItem('meter-house', houseInput.value); }catch(err){}
});
villageInput.addEventListener('input', ()=>{
  try{ localStorage.setItem('meter-village', villageInput.value); }catch(err){}
});

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=> toastEl.classList.remove('show'), 1800);
}

function todayISO(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off*60000).toISOString().slice(0,10);
}
dateInput.value = todayISO();

function todayShort(){
  const d = new Date();
  return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function pickedDateShort(){
  const iso = dateInput.value || todayISO();
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric' });
}

dateToggle.addEventListener('change', ()=>{
  dateInput.disabled = !dateToggle.checked;
  redraw();
});
dateInput.addEventListener('input', redraw);

document.querySelectorAll('.type-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    meterType = btn.getAttribute('data-type');
    splitRow.style.display = meterType === 'split' ? 'flex' : 'none';
    singleRow.style.display = meterType === 'single' ? 'flex' : 'none';
    redraw();
  });
});

document.querySelectorAll('.corner-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.corner-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    corner = btn.getAttribute('data-corner');
    redraw();
  });
});

// --- camera flow ---
async function openCamera(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1200 },
        aspectRatio: { ideal: 1 }
      },
      audio: false
    });
  }catch(err){
    showToast('Нет доступа к камере');
    return;
  }
  track = stream.getVideoTracks()[0];
  video.srcObject = stream;
  drop.style.display = 'none';
  camWrap.style.display = 'block';
  camControls.style.display = 'flex';
  closeCamBtn.style.display = 'block';

  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if(caps && caps.torch){
    torchBtn.style.display = 'flex';
    camNote.style.display = 'none';
    if(desiredTorch){
      try{
        await track.applyConstraints({ advanced: [{ torch: true }] });
        torchOn = true;
        torchBtn.classList.add('on');
      }catch(err){
        torchOn = false;
        torchBtn.classList.remove('on');
      }
    } else {
      torchOn = false;
      torchBtn.classList.remove('on');
    }
  } else {
    torchBtn.style.display = 'none';
    camNote.textContent = 'На этом устройстве фонарик через браузер недоступен — включите его вручную (например, из шторки уведомлений)';
    camNote.style.display = 'block';
  }
}

drop.addEventListener('click', (e)=>{
  e.preventDefault();
  openCamera();
});

torchBtn.addEventListener('click', async ()=>{
  if(!track) return;
  torchOn = !torchOn;
  desiredTorch = torchOn;
  try{
    await track.applyConstraints({ advanced: [{ torch: torchOn }] });
    torchBtn.classList.toggle('on', torchOn);
  }catch(err){
    showToast('Не удалось включить фонарик');
    torchOn = !torchOn;
    desiredTorch = torchOn;
  }
});

closeCamBtn.addEventListener('click', ()=>{
  stopCamera();
  desiredTorch = false;
  torchOn = false;
  camWrap.style.display = 'none';
  closeCamBtn.style.display = 'none';
  drop.style.display = 'flex';
});

function stopCamera(){
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }
  stream = null;
  track = null;
  camWrap.style.display = 'none';
}

shutterBtn.addEventListener('click', ()=>{
  if(!video.videoWidth) return;

  const targetAspect = 1; // width / height
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const sourceAspect = vw / vh;

  let cropX, cropY, cropW, cropH;
  if(sourceAspect > targetAspect){
    cropH = vh;
    cropW = vh * targetAspect;
    cropX = (vw - cropW) / 2;
    cropY = 0;
  } else {
    cropW = vw;
    cropH = vw / targetAspect;
    cropX = 0;
    cropY = (vh - cropH) / 2;
  }

  const outW = 1200;
  const outH = Math.round(outW / targetAspect);
  canvas.width = outW;
  canvas.height = outH;
  ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, outW, outH);

  const frameImg = new Image();
  frameImg.onload = ()=>{
    baseImg = frameImg;
    camControls.style.display = 'none';
    canvas.style.display = 'block';
    retakeBtn.style.display = 'block';
    saveBtn.disabled = false;
    saveBtn.textContent = 'Сохранить в галерею';
    redraw();
  };
  frameImg.src = canvas.toDataURL('image/jpeg', 0.92);
});

function resetFieldsForRetake(){
  flatInput.value = '';
  dayInput.value = '';
  nightInput.value = '';
  singleInput.value = '';
  dateInput.value = todayISO();
  dateToggle.checked = true;
  dateInput.disabled = false;
}

retakeBtn.addEventListener('click', ()=>{
  baseImg = null;
  canvas.style.display = 'none';
  retakeBtn.style.display = 'none';
  saveBtn.disabled = true;
  saveBtn.textContent = 'Сначала сделайте фото';
  resetFieldsForRetake();

  if(stream && track && track.readyState === 'live'){
    camControls.style.display = 'flex';
  } else {
    drop.style.display = 'flex';
    openCamera();
  }
});

function wrapDraw(){
  if(!baseImg) return;
  ctx.drawImage(baseImg, 0, 0, canvas.width, canvas.height);
}

function redraw(){
  if(!baseImg) return;
  wrapDraw();

  const flat = flatInput.value.trim();
  const day = dayInput.value.trim();
  const night = nightInput.value.trim();
  const single = singleInput.value.trim();
  const showDate = dateToggle.checked;

  if(meterType === 'split' && !flat && !day && !night && !showDate){ return; }
  if(meterType === 'single' && !flat && !single && !showDate){ return; }

  const lines = [];
  const dateStr = showDate ? pickedDateShort() : '';
  if(flat && dateStr) lines.push(`кв. ${flat}  ${dateStr}`);
  else if(flat) lines.push(`кв. ${flat}`);
  else if(dateStr) lines.push(dateStr);

  if(meterType === 'split'){
    if(day) lines.push(['Д', day, '#F0C878']);
    if(night) lines.push(['Н', night, '#B9C6E8']);
  } else {
    if(single) lines.push(['Показание', single, '#EAF0EE']);
  }

  if(lines.length === 0){ return; }

  const scale = canvas.width / 1000;
  const fontSize = Math.max(20, 30 * scale);
  const padding = Math.max(10, 16 * scale);
  const lineGap = fontSize * 1.35;

  ctx.font = `600 ${fontSize}px "SFMono-Regular", Consolas, Menlo, monospace`;
  ctx.textBaseline = 'top';

  let boxW = 0;
  const rendered = lines.map(l=>{
    const text = Array.isArray(l) ? `${l[0]}: ${l[1]}` : l;
    const w = ctx.measureText(text).width;
    if(w > boxW) boxW = w;
    return { text, color: Array.isArray(l) ? l[2] : '#EAF0EE' };
  });
  boxW += padding * 2;
  const boxH = lineGap * rendered.length + padding * 1.2;

  let x, y;
  const margin = padding * 0.9;
  if(corner === 'tl'){ x = margin; y = margin; }
  if(corner === 'tr'){ x = canvas.width - boxW - margin; y = margin; }
  if(corner === 'bl'){ x = margin; y = canvas.height - boxH - margin; }
  if(corner === 'br'){ x = canvas.width - boxW - margin; y = canvas.height - boxH - margin; }

  ctx.fillStyle = 'rgba(22,34,31,0.72)';
  const r = 10 * scale;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + boxW, y, x + boxW, y + boxH, r);
  ctx.arcTo(x + boxW, y + boxH, x, y + boxH, r);
  ctx.arcTo(x, y + boxH, x, y, r);
  ctx.arcTo(x, y, x + boxW, y, r);
  ctx.closePath();
  ctx.fill();

  rendered.forEach((l, i)=>{
    ctx.fillStyle = l.color;
    ctx.fillText(l.text, x + padding, y + padding * 0.6 + i * lineGap);
  });
}

flatInput.addEventListener('input', redraw);
dayInput.addEventListener('input', redraw);
nightInput.addEventListener('input', redraw);
singleInput.addEventListener('input', redraw);

function sanitizeForFilename(str){
  return str
    .trim()
    .replace(/[\\\/:*?"<>|,.]/g, '')
    .replace(/\s+/g, '-');
}

function padFlat(flat){
  const digitsOnly = flat.replace(/\D/g, '');
  if(digitsOnly && digitsOnly === flat){
    return digitsOnly.padStart(3, '0');
  }
  return flat;
}

function buildFileName(){
  const parts = [];
  const village = sanitizeForFilename(villageInput.value || '');
  const house = sanitizeForFilename(houseInput.value || '');
  const flat = flatInput.value.trim();
  const dateForName = dateInput.value || todayISO();

  if(flat) parts.push(`кв${padFlat(flat)}`);
  if(village) parts.push(village);
  if(house) parts.push(house);
  parts.push(dateForName);

  const base = parts.length ? parts.join('_') : `Показания-${Date.now()}`;
  return `${base}.jpg`;
}

saveBtn.addEventListener('click', ()=>{
  if(!baseImg){ return; }
  canvas.toBlob((blob)=>{
    const fileName = buildFileName();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
    showToast('Сохранено в Загрузки');
  }, 'image/jpeg', 0.9);
});

window.addEventListener('beforeunload', stopCamera);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
